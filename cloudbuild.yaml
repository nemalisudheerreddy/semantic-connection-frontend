substitutions:
  _BACKEND_URL: https://backend-api-3evu5agarq-uc.a.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/frontend-web:$COMMIT_SHA
      - --build-arg
      - VITE_API_BASE_URL=${_BACKEND_URL}
      - --build-arg
      - NGINX_CONF=nginx.cloudrun.conf
      - .

  - name: gcr.io/cloud-builders/docker
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/frontend-web:$COMMIT_SHA']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - frontend-web
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/frontend-web:$COMMIT_SHA
      - --region=us-central1
      - --allow-unauthenticated

options:
  logging: CLOUD_LOGGING_ONLY