<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Frontend screen preview</title>
  <desc id="desc">Illustrated preview of the React page showing a form and JSON response panel.</desc>
  <rect width="960" height="620" rx="28" fill="#f8fafc"/>
  <rect x="40" y="40" width="880" height="540" rx="24" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text x="80" y="96" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4338ca">React + FastAPI example</text>
  <text x="80" y="142" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#0f172a">Simple frontend to backend flow</text>
  <text x="80" y="180" font-family="Arial, sans-serif" font-size="20" fill="#475569">Enter a name, call the API, and inspect the JSON response.</text>
  <rect x="80" y="240" width="350" height="270" rx="22" fill="#f8fbff" stroke="#dbe4f0" stroke-width="2"/>
  <text x="110" y="285" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Try the API</text>
  <rect x="110" y="315" width="290" height="40" rx="12" fill="#eef2ff"/>
  <text x="130" y="341" font-family="Courier New, monospace" font-size="16" fill="#1e293b">POST http://localhost:8000/api/greet</text>
  <text x="110" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Your name</text>
  <rect x="110" y="405" width="290" height="48" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="130" y="435" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Enter your name</text>
  <rect x="110" y="470" width="290" height="46" rx="12" fill="#4f46e5"/>
  <text x="255" y="499" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Send to backend</text>
  <rect x="480" y="240" width="360" height="270" rx="22" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text x="510" y="285" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Latest response</text>
  <rect x="510" y="315" width="300" height="150" rx="14" fill="#111827"/>
  <text x="535" y="350" font-family="Courier New, monospace" font-size="17" fill="#e5eefc">{</text>
  <text x="555" y="380" font-family="Courier New, monospace" font-size="17" fill="#e5eefc">"message": "Hello, Sudheer!",</text>
  <text x="555" y="410" font-family="Courier New, monospace" font-size="17" fill="#e5eefc">"received_name": "Sudheer",</text>
  <text x="555" y="440" font-family="Courier New, monospace" font-size="17" fill="#e5eefc">"timestamp": "2026-10-11T..."</text>
  <text x="535" y="470" font-family="Courier New, monospace" font-size="17" fill="#e5eefc">}</text>
  <rect x="510" y="482" width="300" height="46" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="535" y="511" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">Hello, Sudheer! Returned at 2026-10-11T...</text>
</svg>
